name: Build and Release seedict Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v0.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_ENV_NAME: production
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_OSS_URL: ${{ vars.VITE_OSS_URL }}
          VITE_API_BASE_PATH: ${{ vars.VITE_API_BASE_PATH }}
        run: npm run build

      - name: Pack artifact
        run: |
          test -d dist
          tar -czf "seedict-dist-${{ github.event.inputs.version }}.tar.gz" dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seedict-dist-${{ github.event.inputs.version }}
          path: seedict-dist-${{ github.event.inputs.version }}.tar.gz
          retention-days: 30

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            seedict-dist-${{ github.event.inputs.version }}.tar.gz
